name: V2 data contract

on:
  pull_request:
    paths:
      - ".github/workflows/data-contract.yml"
      - "drizzle/**"
      - "scripts/test-db/**"
      - "scripts/verify-auth-http.mjs"
      - "src/app/(admin)/**"
      - "src/app/(auth)/**"
      - "src/app/(public)/account/**"
      - "src/app/(public)/forgot-password/**"
      - "src/app/(public)/login/**"
      - "src/app/(public)/signup/**"
      - "src/app/api/admin/**"
      - "src/app/api/auth/**"
      - "src/components/accounts/**"
      - "src/components/admin/**"
      - "src/components/auth/**"
      - "src/modules/accounts/**"
      - "src/modules/auth/**"
      - "src/modules/players/**"
      - "src/platform/db/**"
      - "tests/database/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: klol_v2_test_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klol_v2_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:db
        env:
          CI: "true"
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:synthetic_ci_only@127.0.0.1:5432/klol_v2_test_ci
          V2_DB_TEST_MODE: "true"
          V2_USE_CI_POSTGRES_SERVICE: "true"
