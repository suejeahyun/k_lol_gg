name: V2 data contract

on:
  # 앱 어느 영역의 변경도 공유 스키마, 인증 경계, 릴리스 근거에 영향을 줄 수 있다.
  # 경로 필터로 검증이 건너뛰어지지 않도록 모든 PR에서 실행한다.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: klol_v2_test_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klol_v2_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스 근거 검사는 registry의 annotated tag와 commit을 대조한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:db
        env:
          CI: "true"
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:synthetic_ci_only@127.0.0.1:5432/klol_v2_test_ci
          V2_DB_TEST_MODE: "true"
          V2_USE_CI_POSTGRES_SERVICE: "true"
      - run: npm run verify:auth-http
      - run: npm run release:evidence:check
      - run: npm run security:secrets
