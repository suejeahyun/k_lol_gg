<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7FBFF" />
    <title>K-LOL.GG</title>
    <style>
      :root {
        color-scheme: light;
        background: #f7fbff;
        color: #24304a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 18% 18%, rgba(125, 211, 252, 0.48), transparent 34%),
          radial-gradient(circle at 82% 16%, rgba(196, 181, 253, 0.45), transparent 32%),
          radial-gradient(circle at 50% 88%, rgba(167, 243, 208, 0.42), transparent 36%),
          linear-gradient(180deg, #f7fbff, #f3f0ff);
      }

      main {
        display: grid;
        gap: 10px;
        width: min(320px, calc(100vw - 40px));
        padding: 28px 24px;
        border: 1px solid rgba(65, 105, 216, 0.18);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 22px 60px rgba(65, 105, 216, 0.14);
        text-align: center;
      }

      strong {
        font-size: 28px;
        font-weight: 950;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #5a6982;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>K-LOL.GG</strong>
      <p>앱 화면을 불러오는 중입니다. 네트워크 연결을 확인해주세요.</p>
    </main>
  </body>
</html>
